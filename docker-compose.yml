version: "3.8"
services:
  mariadb:
    build: .
    image: mariadb-optimized:11.8.3-noble-lts
    container_name: mariadb-optimized
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=TuPasswordSeguro
      # - MARIADB_DATABASE=appdb
      # - MARIADB_USER=appuser
      # - MARIADB_PASSWORD=AppPassSegura
    volumes:
      - /srv/mariadb/data:/var/lib/mysql
    tmpfs:
      - /var/lib/mysql/tmp:rw,size=32m
    mem_limit: 128m
    memswap_limit: 256m
    shm_size: 64m
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--silent"]
      interval: 30s
      timeout: 5s
      retries: 3
